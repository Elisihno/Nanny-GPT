<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NANNY</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;color:#eee;font-family:Georgia,serif;touch-action:none}button,select{touch-action:manipulation}#game{position:fixed;inset:0;width:100%;height:100%;display:block}#screens{position:fixed;inset:0;z-index:4;background:#080707}section{position:absolute;inset:0;display:none}section.active{display:block}#title{background:radial-gradient(ellipse at 72% 58%,#443b34 0%,#17120f 43%,#050404 90%)}#title:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(94deg,transparent 0 58px,#0002 60px 64px)}#title h1{position:absolute;top:12%;left:9%;font-size:clamp(65px,15vw,140px);font-weight:400;letter-spacing:.1em;margin:0;text-shadow:0 6px 12px #280000}#title .choices{position:absolute;left:10%;top:57%;display:grid;gap:18px}button.menu{border:0;background:transparent;color:#eee;font:clamp(32px,6vw,62px) Georgia,serif;letter-spacing:.13em;text-align:left;padding:4px}button.menu:active{color:#c4a19a}#shadow{position:absolute;right:17%;bottom:0;width:18%;height:60%;border-radius:45% 45% 0 0;background:linear-gradient(90deg,#1a1415,#5a1e24,#140b0e);filter:brightness(.65);box-shadow:0 0 30px #000}#shadow:before{content:'';position:absolute;top:-17%;left:27%;width:48%;height:23%;background:#807c71;border-radius:50%;box-shadow:0 0 25px #000}#settings{background:radial-gradient(ellipse,#211717,#080606);padding:5vw;overflow:auto}#settings h2{font-style:italic;font-size:clamp(35px,7vw,60px);font-weight:400;margin:0 0 30px}#settings .settingsGrid{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:16px;align-items:start;font:italic clamp(16px,3vw,26px) Georgia,serif}#settings label{display:block;margin:10px 0}#settings select{font:normal 18px system-ui;padding:8px;max-width:100%}#desc{border:2px solid #eee;padding:12px;min-height:155px}#settings .nav{display:flex;justify-content:space-between;margin-top:30px}#settings button{font:italic 28px Georgia,serif;background:transparent;border:2px solid white;color:white;padding:6px 18px}#hud{position:fixed;inset:0;pointer-events:none;display:none;font:17px system-ui}#hud button{pointer-events:auto;color:white;background:#292b2ca8;border:1px solid #bbb8;border-radius:15px;padding:14px;font-size:20px}#night{position:absolute;top:18px;left:18px;text-shadow:0 2px 5px black}#pause{position:absolute;right:14px;top:12px}#hint{position:absolute;top:65px;left:50%;transform:translateX(-50%);text-align:center;background:#0009;padding:8px 12px;border-radius:8px;max-width:80%}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;color:#fff9}#joy{position:absolute;left:24px;bottom:30px;width:120px;height:120px;border-radius:50%;border:2px solid #fff6;background:#fff2;pointer-events:auto;touch-action:none}#nub{position:absolute;left:34px;top:34px;width:50px;height:50px;border-radius:50%;background:#ddd8}#actions{position:absolute;right:20px;bottom:30px;display:grid;grid-template-columns:65px 65px;gap:12px}#actions button{height:62px}#status{position:absolute;left:14px;top:50px;font-size:14px}#overlay{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:8;text-align:center;padding:25px}#overlay h2{font:60px Georgia,serif}#overlay button{background:#342222;color:white;border:1px solid #aaa;padding:14px 30px;font-size:22px}#error{position:fixed;bottom:0;left:0;right:0;background:#3b1717;color:white;font:13px system-ui;padding:8px;display:none;z-index:20}@media(max-width:650px){#settings .settingsGrid{grid-template-columns:1fr 1fr}#desc{grid-column:1/-1;grid-row:2}#settings .nav{margin-top:15px}#settings button{font-size:23px}#title h1{font-size:17vw}}
</style></head><body><canvas id="game"></canvas><div id="screens"><section id="title" class="active"><div id="shadow"></div><h1>NANNY</h1><div class="choices"><button class="menu" id="play">PLAY</button><button class="menu" id="options">OPTIONS</button></div></section><section id="settings"><h2 id="settingsTitle">Play</h2><div class="settingsGrid"><div><label>Difficulty</label><select id="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option><option>Extreme</option></select></div><div><label>Darker <input type="checkbox" id="darker"></label><label>Limping <input type="checkbox" id="limping"></label><label>Fear meter <input type="checkbox" id="fear" checked></label><label>Music <input type="checkbox" id="music" checked></label><label>Quality <select id="quality"><option>Low</option><option selected>High</option></select></label></div><div id="desc"></div></div><div class="nav"><button id="back">‹ Back</button><button id="continue">Continue ›</button></div></section></div><div id="hud"><div id="night">NIGHT 1</div><div id="status">Find the key and escape</div><div id="hint"></div><div id="cross">+</div><button id="pause">Ⅱ</button><div id="joy"><div id="nub"></div></div><div id="actions"><button id="interact">✋</button><button id="crouch">▾</button><button id="run">RUN</button><button id="drop">DROP</button></div></div><div id="overlay"><h2 id="overTitle"></h2><p id="overText"></p><button id="restart">Continue</button></div><div id="error"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id);let mode='title',night=1,hasKey=false,crouched=false,running=false,lookX=0,lookY=0,stickX=0,stickY=0,started=0,dead=false,interactTarget=null;const descriptions={Easy:'Nanny is slower than you.\nYou have 5 nights to escape.\nA quiet start: 40 seconds.',Medium:'Nanny is a little slower than you.\nYou have 5 nights to escape.\nA quiet start: 25 seconds.',Hard:'Nanny moves almost as fast as you.\nYou have 5 nights to escape.\nA quiet start: 15 seconds.',Extreme:'Nanny is faster than you.\nYou have 5 nights to escape.\nA quiet start: 5 seconds.'};function show(id){for(let s of document.querySelectorAll('section'))s.classList.toggle('active',s.id===id)}function desc(){$('desc').innerText='Difficulty: '+$('difficulty').value+'\n'+descriptions[$('difficulty').value]}$('difficulty').onchange=desc;desc();$('play').onclick=()=>{show('settings');$('settingsTitle').textContent='Play'};$('options').onclick=()=>{show('settings');$('settingsTitle').textContent='Options'};$('back').onclick=()=>show('title');$('continue').onclick=()=>start();const renderer=new THREE.WebGLRenderer({canvas:$('game'),antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();scene.background=new THREE.Color('#0e0d0b');scene.fog=new THREE.Fog('#0e0d0b',5,27);scene.add(new THREE.HemisphereLight(0xb6b0a0,0x302820,1.2));const lamp=new THREE.PointLight(0xffdcaa,35,18);lamp.position.set(0,2.6,0);scene.add(lamp);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,80);camera.rotation.order='YXZ';let player=new THREE.Vector3(0,1.6,6),nanny=new THREE.Group();const colliders=[];const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:1});const wall=mat('#777067'),floor=mat('#3e3027'),wood=mat('#48352a'),dress=mat('#605e56'),skin=mat('#8c897b'),apron=mat('#b6a99a'),red=mat('#66312b');function box(w,h,d,x,y,z,m,solid=false){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);if(solid)colliders.push(o);return o}box(18,.2,18,0,-.1,0,floor);box(18,.2,18,0,3.6,0,wood);box(18,3.6,.25,0,1.8,-9,wall,true);box(18,3.6,.25,0,1.8,9,wall,true);box(.25,3.6,18,-9,1.8,0,wall,true);box(.25,3.6,18,9,1.8,0,wall,true);for(let x of [-6,6]){box(.22,3.6,5,x,1.8,-6.5,wall,true);box(.22,3.6,5,x,1.8,6.5,wall,true)}for(let z of [-3,3]){box(5,3.6,.22,-6.5,1.8,z,wall,true);box(5,3.6,.22,6.5,1.8,z,wall,true)}box(2.5,.8,1.4,-5,.4,5,wood,true);box(2,1,1,-5,.5,-5,wood,true);box(1.5,1.7,.7,5,.85,-5,wood,true);box(2,.12,1.1,5,.7,5,wood,true);for(let i=0;i<5;i++)box(.7,.6,.7,-7.7,.3,-7+i*3,wood,true);const door=box(1.8,2.8,.15,0,1.4,-8.82,wood);const lock=box(.18,.18,.12,.6,1.3,-8.65,mat('#c7a457'));const key=box(.35,.07,.09,5,.78,5,mat('#cba75a'));const keyRing=new THREE.Mesh(new THREE.TorusGeometry(.12,.035,6,10),mat('#cba75a'));keyRing.position.set(5.26,.78,5);scene.add(keyRing);const torso=new THREE.Mesh(new THREE.CylinderGeometry(.3,.58,1.65,9),dress);torso.position.y=1.13;nanny.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.26,10,8),skin);head.position.y=2.22;nanny.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.27,9,8),mat('#777873'));hair.position.set(0,2.39,-.06);nanny.add(hair);for(let s of [-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),mat('#dfdfce'));eye.position.set(s*.105,2.25,.235);nanny.add(eye);const arm=new THREE.Mesh(new THREE.CylinderGeometry(.08,.065,1.1,7),skin);arm.position.set(s*.42,1.45,0);arm.rotation.z=s*.13;nanny.add(arm)}const bib=new THREE.Mesh(new THREE.BoxGeometry(.46,.75,.04),apron);bib.position.set(0,1.35,.33);nanny.add(bib);const skirt=new THREE.Mesh(new THREE.BoxGeometry(.85,.55,.04),apron);skirt.position.set(0,.67,.5);nanny.add(skirt);nanny.position.set(-5,0,-5);scene.add(nanny);let patrol=[[-5,-5],[5,-5],[5,5],[-5,5],[0,0]],patrolI=0;function canMove(x,z){if(Math.abs(x)>8.65||Math.abs(z)>8.65)return false;for(const o of colliders){const b=new THREE.Box3().setFromObject(o);if(x>b.min.x-.28&&x<b.max.x+.28&&z>b.min.z-.28&&z<b.max.z+.28)return false}return true}function start(){mode='game';dead=false;night=1;hasKey=false;key.visible=true;keyRing.visible=true;player.set(0,1.6,6);nanny.position.set(-5,0,-5);started=performance.now();$('screens').style.display='none';$('hud').style.display='block';$('overlay').style.display='none';$('night').textContent='NIGHT 1';$('status').textContent='Find the key and escape';}function overlay(title,message){mode='over';$('overlay').style.display='flex';$('overTitle').textContent=title;$('overText').textContent=message;$('hud').style.display='none'}$('restart').onclick=()=>{if(night>5||hasKey&&dead===false){$('screens').style.display='block';show('title');$('overlay').style.display='none';mode='title'}else{mode='game';player.set(0,1.6,6);nanny.position.set(-5,0,-5);started=performance.now();$('overlay').style.display='none';$('hud').style.display='block';$('night').textContent='NIGHT '+night}};$('pause').onclick=()=>overlay('PAUSED','Tap Continue to return to the game');$('interact').onclick=()=>{if(mode!=='game')return;if(interactTarget==='key'){hasKey=true;key.visible=false;keyRing.visible=false;$('status').textContent='Key found — unlock the front door'}else if(interactTarget==='door'){if(hasKey){dead=false;night=6;overlay('YOU ESCAPED','You survived Nanny!')}else $('status').textContent='The door is locked. Find the brass key.'}};$('crouch').onclick=()=>{crouched=!crouched;$('crouch').style.background=crouched?'#777':'#292b2ca8'};$('run').onpointerdown=()=>running=true;$('run').onpointerup=()=>running=false;$('run').onpointercancel=()=>running=false;$('drop').onclick=()=>{$('status').textContent=hasKey?'Keep the key to escape':'Nothing to drop'};const joy=$('joy'),nub=$('nub');joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);moveStick(e)});joy.addEventListener('pointermove',e=>{if(e.buttons||e.pressure)moveStick(e)});function moveStick(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.max(1,Math.hypot(dx,dy)),k=Math.min(1,53/len);stickX=dx*k/53;stickY=dy*k/53;nub.style.transform='translate('+dx*k+'px,'+dy*k+'px)'}function resetStick(){stickX=stickY=0;nub.style.transform=''}joy.addEventListener('pointerup',resetStick);joy.addEventListener('pointercancel',resetStick);let looking=false,lastX=0,lastY=0;const canvas=$('game');canvas.addEventListener('pointerdown',e=>{if(mode!=='game')return;looking=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!looking||mode!=='game')return;lookX-=(e.clientX-lastX)*.004;lookY=Math.max(-1.3,Math.min(1.3,lookY-(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('pointerup',()=>looking=false);const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='e')$('interact').click()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let last=performance.now();function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000);last=t;if(mode==='game'){const vx=stickX+(keys.d?1:0)-(keys.a?1:0),vz=-stickY+(keys.w?1:0)-(keys.s?1:0),speed=(crouched?1.2:running?4.4:2.6)*dt;let dx=(Math.sin(lookX)*vz+Math.cos(lookX)*vx)*speed,dz=(-Math.cos(lookX)*vz+Math.sin(lookX)*vx)*speed;if(canMove(player.x+dx,player.z))player.x+=dx;if(canMove(player.x,player.z+dz))player.z+=dz;player.y+=( (crouched?1:1.6)-player.y)*Math.min(1,dt*10);camera.position.copy(player);camera.rotation.set(lookY,lookX,0);const dist=nanny.position.distanceTo(new THREE.Vector3(player.x,0,player.z)),quiet=({Easy:40,Medium:25,Hard:15,Extreme:5})[$('difficulty').value],active=(t-started)/1000>quiet;let target=patrol[patrolI],chase=active&&dist<(crouched?3:running?10:7);if(chase)target=[player.x,player.z];const nx=target[0]-nanny.position.x,nz=target[1]-nanny.position.z,nd=Math.hypot(nx,nz);if(active&&nd>.25){const ns=({Easy:1.2,Medium:1.8,Hard:2.5,Extreme:3.1})[$('difficulty').value]*dt;nanny.position.x+=nx/nd*ns;nanny.position.z+=nz/nd*ns;nanny.rotation.y=Math.atan2(nx,nz)}else if(!chase&&nd<=.25)patrolI=(patrolI+1)%patrol.length;if(active&&dist<.8){night++;dead=true;overlay(night>5?'GAME OVER':'NANNY FOUND YOU',night>5?'You ran out of nights.':'Night '+night+' begins.')}const kd=Math.hypot(player.x-5,player.z-5),dd=Math.hypot(player.x,player.z+8.8);interactTarget=kd<1.8&&!hasKey?'key':dd<2.2?'door':null;$('hint').textContent=interactTarget==='key'?'✋ Pick up brass key':interactTarget==='door'?'✋ Open exit door':'';scene.fog.far=$('darker').checked?13:27;lamp.intensity=$('darker').checked?15:35;}renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></body></html>
